name: Android beta issue
description: Report a problem with the Android beta build.
title: "[Android beta]: "
labels:
  - android
  - beta
body:
  - type: markdown
    attributes:
      value: |
        Android beta source lives in Android/ on master. Do not share Discord tokens, account details, or private screenshots.
  - type: input
    id: branch_commit
    attributes:
      label: Branch or commit
      description: Example: v3.3.4, master at 10be37d, or beta/androidbuild at 10be37d
    validations:
      required: true
  - type: dropdown
    id: device_type
    attributes:
      label: Test device
      options:
        - Android Studio emulator
        - Physical Android phone
        - Other
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version or API level
      description: Example: Android 15 / API 35
    validations:
      required: true
  - type: dropdown
    id: music_source
    attributes:
      label: Metadata source
      options:
        - Fake Amazon test app
        - Real Amazon Music notification
        - Other media notification
        - I am not sure
    validations:
      required: true
  - type: dropdown
    id: discord_presence
    attributes:
      label: Discord Rich Presence result
      options:
        - Shows correctly
        - Does not show
        - Shows old track
        - Shows wrong metadata
        - Clears unexpectedly
        - App crashes
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove private account names, tokens, and notifications before posting.
