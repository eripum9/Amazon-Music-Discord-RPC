name: Security

on:
  push:
    branches:
      - master
      - "rewrite/**"
      - "fix/**"
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            Windows/requirements.txt
            Windows/requirements-dev.txt
            Windows/requirements-build.txt
      - name: Install audit tools
        run: python -m pip install pip-audit==2.10.1 ruff==0.15.21
      - name: Audit runtime dependencies
        run: python -m pip_audit -r Windows/requirements.txt --strict
      - name: Audit build dependencies
        run: python -m pip_audit -r Windows/requirements-build.txt --strict
      - name: Ruff safety checks
        run: python -m ruff check Windows --select E9,F63,F7,F82

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
