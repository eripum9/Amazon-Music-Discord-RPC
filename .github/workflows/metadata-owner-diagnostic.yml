name: Build Issue 52 Diagnostic

on:
  push:
    branches:
      - fix/52-metadata-owner-verification
    paths:
      - .github/workflows/metadata-owner-diagnostic.yml
      - Windows/amazon_devtools.py
      - Windows/config.py
      - Windows/installer.iss
      - Windows/windows_listener_owner.py
      - Windows/tests/test_owner_diagnostics.py
      - Windows/tests/test_windows_listener_owner.py
      - docs/issue-52-diagnostic.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-52-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: Windows/requirements-release.lock

      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes --only-binary=winsdk -r Windows/requirements-release.lock

      - name: Validate owner diagnostics
        run: python -m pytest Windows/tests/test_amazon_devtools.py Windows/tests/test_owner_diagnostics.py Windows/tests/test_windows_listener_owner.py -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --version 6.7.3 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $compilerPaths = @(
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $compilerPaths | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $compiler) {
            throw 'Inno Setup compiler was not found.'
          }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build diagnostic executable
        run: python -m PyInstaller Windows/AmazonMusicRPC.spec --noconfirm --clean --workpath Windows/build --distpath Windows/dist

      - name: Build diagnostic installer and evidence
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'Windows/diagnostic_output'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $env:INNO_COMPILER "/O$outputDir" '/FAmazonMusicRPC_Setup_v5.0.4_issue52-final-test' Windows/installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed: $LASTEXITCODE"
          }
          $installerName = 'AmazonMusicRPC_Setup_v5.0.4_issue52-final-test.exe'
          $installer = Join-Path $outputDir $installerName
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $installerName" -Encoding ascii
          Copy-Item -LiteralPath docs/issue-52-diagnostic.md -Destination (Join-Path $outputDir 'TEST-INSTRUCTIONS.md')
          [ordered]@{
            diagnostic_build = 'issue52-3'
            base_version = '5.0.4'
            commit = $env:GITHUB_SHA
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            installer = $installerName
            sha256 = $hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $outputDir 'build-info.json') -Encoding utf8NoBOM
          python Windows/release_smoke.py --installer $installer --executable Windows/dist/AmazonMusicRPC.exe --expected-pillow 12.3.0
          if ($LASTEXITCODE -ne 0) {
            throw 'Diagnostic artifact smoke check failed.'
          }

      - name: Upload diagnostic test build
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AmazonMusicRPC-v5.0.4-issue52-final-test-${{ github.run_id }}
          path: Windows/diagnostic_output/
          if-no-files-found: error
          retention-days: 30

      - name: Show download link
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "## Issue 52 diagnostic installer" >> $env:GITHUB_STEP_SUMMARY
          "[Download installer, checksum, and test instructions]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Base version: 5.0.4. Final test build: issue52-3. No GitHub release or updater publication is created." >> $env:GITHUB_STEP_SUMMARY
