name: Android Host Tests

on:
  push:
    branches:
      - beta/androidbuild
    paths:
      - "Android/**"
      - ".github/workflows/android-host-tests.yml"
  pull_request:
    branches:
      - beta/androidbuild
    paths:
      - "Android/**"
      - ".github/workflows/android-host-tests.yml"

jobs:
  android-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.2"
      - name: Host check
        run: gradle -p Android hostCheck --no-daemon
