name: Windows Tests

on:
  push:
    branches:
      - master
      - "fix/**"
      - "beta/**"
      - "rewrite/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Windows/requirements-dev.txt
      - name: Compile
        run: python -m py_compile Windows/main.py Windows/desktop_runtime.py Windows/app_models.py Windows/runtime_state.py Windows/task_supervisor.py Windows/structured_logging.py Windows/window_controller.py Windows/rpc_controller.py Windows/command_controller.py Windows/amazon_devtools.py Windows/media_reader.py Windows/discord_rpc.py Windows/config.py Windows/credential_store.py Windows/network_audit.py Windows/updater.py Windows/status_summary.py Windows/qt_tray_ui.py Windows/rpc_state.py Windows/metadata_pipeline.py Windows/launcher_diagnostics.py Windows/security_trust.py Windows/self_tests.py Windows/release_smoke.py
      - name: Pytest
        run: python -m pytest Windows/tests
      - name: Built-in self-tests
        run: python Windows/run_self_tests.py
      - name: Ruff safety checks
        run: python -m ruff check Windows --select E9,F63,F7,F82
      - name: Typed controller checks
        run: python -m pyright Windows/app_models.py Windows/runtime_state.py Windows/task_supervisor.py Windows/structured_logging.py Windows/window_controller.py Windows/rpc_controller.py Windows/command_controller.py Windows/main.py
      - name: Release smoke
        run: python Windows/release_smoke.py --allow-missing-installer
      - name: Whitespace
        run: git diff --check
